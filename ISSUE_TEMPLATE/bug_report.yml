name: Bug report
description: Something isn't working as expected.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Security issues:** please don't open an issue — see SECURITY.md.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Tide, Reef, Dashboard, CLI / TUI, MCP server, Website, Docs, Brand, Data export, Other]
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `crust tide deploy`
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `crust --version`, or "hosted" if on crustates.eu.
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove secrets and personal data first.
      render: shell
